<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excel to PPT - India Post theme</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f6f6f6;color:#2b2b2b;padding:16px}
.wrap{max-width:620px;margin:0 auto}
h1{font-size:24px;margin:6px 0 4px;color:#b3121b}
p.sub{margin:0 0 14px;color:#666;font-size:14px}
.card{background:#fff;border:1px solid #d0d0d0;border-radius:10px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px;color:#b3121b}
label{font-size:13px;display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
input[type=text]{height:38px;border:1px solid #d0d0d0;border-radius:6px;padding:0 8px;font-size:14px}
.drop{display:block;border:2px dashed #b3121b;border-radius:10px;padding:24px 10px;text-align:center;cursor:pointer;background:#fff7f7;margin:0}
.row{display:flex;gap:8px;align-items:center;font-size:13px;flex-direction:row}
button{width:100%;height:48px;border:0;border-radius:8px;font-size:16px;font-weight:700;color:#fff;background:#b3121b;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
#msg{margin-top:10px;font-size:14px;min-height:20px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Excel se PPT (India Post theme)</h1>
  <p class="sub">Excel upload karo, aapki di hui PPT jaisi design me slides ban jayengi.</p>

  <div class="card">
    <h2>1. Excel upload karo</h2>
    <label class="drop"><b>Excel file chuno</b><br>.xlsx, .xls ya .csv
      <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
    </label>
    <div id="msg"></div>
  </div>

  <div class="card">
    <h2>2. Cover slide ki details</h2>
    <label>Chhota heading<input type="text" id="kicker" value="INDIA POST"></label>
    <label>Main title<input type="text" id="ptitle" value="Vertical-wise & Division-wise Performance Review"></label>
    <label>Subtitle<input type="text" id="sub" value="Revenue, Article Count, Aadhaar | PLI & RPLI And POSB"></label>
    <label>Peela badge<input type="text" id="badge" value="Indore Region | Q1 & Q2, FY 2026-27"></label>
    <label class="row"><input type="checkbox" id="chart"> Numbers wale columns ka chart bhi banao</label>
  </div>

  <button id="go" disabled>PPT banao aur download karo</button>
</div>

const T = {red:'B3121B', orange:'E46C0A', yellow:'FDB913', total:'FFF0C2', text:'2B2B2B', line:'D0D0D0', zebra:'F6F6F6', grey:'777777', font:'Arial'};
const $ = id => document.getElementById(id);
let wb = null, fname = 'Presentation';

$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    wb = XLSX.read(await f.arrayBuffer(), {type:'array'});
    fname = f.name.replace(/\.[^.]+$/,'');
    $('msg').textContent = `${f.name} mil gayi. Sheets: ${wb.SheetNames.length}`;
    $('go').disabled = false;
  }catch(err){ $('msg').textContent = 'File nahi khul payi. Kya ye sahi Excel file hai?'; }
});

const isNum = v => /^[\s$₹-]*\d[\d,]*(\.\d+)?\s*%?\s*$/.test(String(v));
const toNum = v => parseFloat(String(v).replace(/[^0-9.\-]/g,''));

function build(){
  const p = new PptxGenJS(); p.layout = 'LAYOUT_WIDE'; // 13.33 x 7.5
  const F = T.font;

  // Cover
  let s = p.addSlide(); s.background = {color:T.red};
  s.addText($('kicker').value,{x:.9,y:1.6,w:8,h:.5,fontFace:F,fontSize:20,bold:true,color:T.yellow,charSpacing:4,margin:0});
  s.addText($('ptitle').value,{x:.9,y:2.2,w:8.4,h:2.2,fontFace:F,fontSize:44,bold:true,color:'FFFFFF',valign:'top',margin:0});
  s.addText($('sub').value,{x:.9,y:4.5,w:8.6,h:.5,fontFace:F,fontSize:16,color:'FFFFFF',margin:0});
  s.addShape(p.ShapeType.roundRect,{x:.9,y:5.3,w:4.6,h:.55,rectRadius:.27,fill:{color:T.yellow}});
  s.addText($('badge').value,{x:.9,y:5.3,w:4.6,h:.55,fontFace:F,fontSize:13,bold:true,color:T.text,align:'center',valign:'middle',margin:0});
  s.addShape(p.ShapeType.roundRect,{x:9.33,y:.6,w:3.1,h:3,rectRadius:.15,fill:{color:'FFFFFF'}});
  s.addImage({data:LOGO,x:9.65,y:.95,w:2.46,h:1.59*1.0+.0});

  wb.SheetNames.forEach(name => {
    const raw = XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:'',raw:false});
    const rows = raw.filter(r => r.some(c => String(c).trim() !== ''));
    if(rows.length < 2) return;
    const cols = Math.max(...rows.map(r=>r.length));
    const pad = r => Array.from({length:cols},(_,i)=>String(r[i] ?? '').trim());
    const head = pad(rows[0]), body = rows.slice(1).map(pad);
    const PER = 10, pages = Math.ceil(body.length/PER);
    const fs = cols>9 ? 9 : cols>6 ? 11 : 13;

    for(let pg=0; pg<pages; pg++){
      const sl = p.addSlide(); sl.background = {color:'FFFFFF'};
      sl.addText(name + (pages>1 ? ` (${pg+1}/${pages})` : ''),{x:.6,y:.35,w:12.1,h:.6,fontFace:F,fontSize:30,bold:true,color:T.red,margin:0});
      const tbl = [head.map(c=>({text:c,options:{bold:true,color:'FFFFFF',fill:{color:T.red},align:'center',valign:'middle'}}))];
      body.slice(pg*PER,(pg+1)*PER).forEach((r,ri)=>{
        const isTot = /total/i.test(r[0]);
        tbl.push(r.map((c,ci)=>{
          let color = T.text, bold = isTot;
          if(/%/.test(head[ci]) && isNum(c)){ const n=toNum(c); if(n<50){color='FF0000';bold=true;} else if(n<75){color=T.orange;bold=true;} }
          return {text:c,options:{color,bold,align:ci===0?'left':(isNum(c)?'center':'left'),valign:'middle',fill:{color:isTot?T.total:(ri%2?T.zebra:'FFFFFF')}}};
        }));
      });
      const c0 = cols>1 ? 2.2 : 12.1, rest = cols>1 ? (12.1-c0)/(cols-1) : 0;
      sl.addTable(tbl,{x:.6,y:1.2,w:12.1,colW:[c0,...Array(cols-1).fill(rest)],fontFace:F,fontSize:fs,border:{type:'solid',color:T.line,pt:.5},rowH:.42});
      sl.addText(String(p.slides.length),{x:12.1,y:7.0,w:.6,h:.3,fontFace:F,fontSize:10,color:T.grey,align:'right',margin:0});
    }

    if($('chart').checked && body.length >= 2){
      const data = body.filter(r=>!/total/i.test(r[0]));
      const nc = head.findIndex((_,ci)=>ci>0 && data.filter(r=>isNum(r[ci])).length >= data.length*.6);
      if(nc > 0){
        const sub = data.filter(r=>isNum(r[nc])).slice(0,12);
        const sl = p.addSlide(); sl.background = {color:'FFFFFF'};
        sl.addText(`${name}: ${head[nc]}`,{x:.6,y:.35,w:12.1,h:.6,fontFace:F,fontSize:30,bold:true,color:T.red,margin:0});
        sl.addChart(p.charts.BAR,[{name:head[nc],labels:sub.map(r=>r[0]),values:sub.map(r=>toNum(r[nc]))}],
          {x:.6,y:1.3,w:12.1,h:5.5,barDir:'col',chartColors:[T.red],showLegend:false,showValue:true,dataLabelColor:T.text,dataLabelFontSize:11,
           catAxisLabelColor:T.text,valAxisLabelColor:T.text,catAxisLabelFontFace:F,valAxisLabelFontFace:F,valGridLine:{color:T.line,size:.5}});
      }
    }
  });
  return p;
}

$('go').onclick = async () => {
  if(typeof PptxGenJS === 'undefined'){ $('msg').textContent = 'Library load nahi hui. Internet check karo aur page refresh karo.'; return; }
  $('go').disabled = true; $('msg').textContent = 'PPT ban rahi hai...';
  try{
    await build().writeFile({fileName: fname + '_PPT.pptx'});
    $('msg').textContent = 'Ho gaya. Download check karo.';
  }catch(err){ $('msg').textContent = 'Error: ' + err.message; }
  $('go').disabled = false;
};
</script>
