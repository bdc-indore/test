<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excel to PPT | India Post</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
:root{--r:#b3121b;--rd:#7f0b12;--y:#fdb913;--bg:#f5f3f1;--t:#25282d;--m:#6b7280;--l:#e5e1dc;--b:#2563eb}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--t);padding-bottom:84px}
header{background:linear-gradient(135deg,var(--r),var(--rd));color:#fff;padding:20px 16px 54px}
header h1{margin:0;font-size:21px}header p{margin:3px 0 0;opacity:.8;font-size:13px}
.wrap{max-width:1000px;margin:-34px auto 0;padding:0 12px}
.steps{display:flex;gap:6px;background:#fff;border-radius:12px;padding:5px;box-shadow:0 4px 16px #0002;margin-bottom:14px}
.steps b{flex:1;text-align:center;padding:9px 4px;border-radius:9px;font-size:13px;color:var(--m);cursor:pointer}.steps b.on{background:var(--r);color:#fff}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 8px #0001}
h2{font-size:15px;margin:0 0 10px}
label{display:block;font-size:12px;color:var(--m);margin-bottom:8px}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--l);border-radius:8px;padding:7px 9px;font:inherit;margin-top:3px;background:#fff;color:var(--t)}
input[type=color]{width:100%;height:32px;padding:2px;border:1px solid var(--l);border-radius:8px;margin-top:3px;background:#fff}
.drop{display:block;border:2px dashed #cfc7bf;border-radius:12px;padding:26px 10px;text-align:center;cursor:pointer;color:var(--t);font-size:14px;margin:0}
.drop:hover{border-color:var(--r)}.drop small{display:block;color:var(--m);margin-top:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:640px){.g2{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
.chip{display:inline-block;background:#f2ece6;border-radius:8px;padding:3px 9px;font-size:12px;color:var(--m);margin:0 6px 6px 0}
#msg a{color:var(--r);cursor:pointer;font-size:12px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.num{background:var(--r);color:#fff;border-radius:8px;padding:3px 10px;font-weight:700;font-size:13px}
.sw{display:flex;align-items:center;gap:6px;margin:0 0 0 auto;color:var(--t);font-weight:600;font-size:13px}
.tg{display:flex;align-items:center;gap:6px;color:var(--t)}.tg input{margin:0}
.tb.off .body{display:none}.tb.off{opacity:.55}
.sec{font-weight:700;font-size:12px;margin:12px 0 6px;display:flex;justify-content:space-between}.sec a{color:var(--r);cursor:pointer;font-weight:600}
.cols{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.col{border:1px solid var(--l);border-radius:20px;padding:3px 10px;background:#fafafa}.col.on{border-color:var(--r);background:#fff1f1}
.col label{margin:0;color:var(--t);display:flex;align-items:center;gap:6px;font-size:13px}.col input{margin:0}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:10px 12px;display:flex;gap:10px;box-shadow:0 -4px 18px #0002;justify-content:center;z-index:20}
.bar button{height:46px;border:0;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;flex:1;max-width:360px}
#next{background:var(--r);color:#fff}#next:disabled{opacity:.4;cursor:not-allowed}#back{background:#f2ece6;color:var(--t)}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.tools button,.strip button,.pop button{border:1px solid var(--l);background:#fff;border-radius:8px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer;color:var(--t)}
.tools button:hover,.pop button:hover{border-color:var(--r)}
.tools label{display:flex;align-items:center;gap:6px;margin:0}.tools input[type=color]{width:34px;margin:0}
.strip{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:4px}.strip button{flex:none;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis}.strip .on{background:var(--r);color:#fff;border-color:var(--r)}
.stage{position:relative}
#vp{width:100%;position:relative;box-shadow:0 4px 24px #0003}
#cv{width:960px;height:540px;position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;user-select:none;touch-action:none}
.el{position:absolute}.el.on{outline:2px solid var(--b)}
.bx{width:100%;height:100%;display:grid;white-space:pre-wrap;padding:2px 6px;overflow:hidden;cursor:move;line-height:1.2;font-family:Arial,sans-serif}
.el img{width:100%;height:100%;display:block;pointer-events:none}
.ph{padding:20px;color:#888;font-size:14px}
.rs{position:absolute;right:-7px;bottom:-7px;width:15px;height:15px;background:var(--b);border-radius:3px;cursor:nwse-resize;display:none}.on>.rs{display:block}
.gr{position:absolute;left:-2px;top:-20px;background:var(--b);color:#fff;padding:1px 8px;border-radius:5px 5px 0 0;cursor:move;font-size:12px;display:none}.on>.gr{display:block}
.el table{border-collapse:collapse;table-layout:fixed;width:100%;font-family:Arial,sans-serif}
.el td,.el th{border:1px solid #d0d0d0;padding:0 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}.el th{cursor:grab}
.el .sel{outline:2px solid var(--b);outline-offset:-2px}
.pop{position:fixed;left:50%;transform:translateX(-50%);bottom:72px;max-height:46vh;overflow:auto;z-index:30;width:min(94vw,460px);background:#fff;border:1px solid var(--l);border-radius:12px;padding:10px;box-shadow:0 10px 30px #0004}
.pop .r{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px;align-items:end}.pop .r button{width:100%}.pop label{margin-bottom:4px}
.pop .dl{width:100%;color:var(--r);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.grid div{border:1px solid var(--l);border-radius:8px;padding:6px;display:grid;gap:4px}.grid img{width:100%;height:80px;object-fit:contain;background:#f6f6f6}
.grid button{border:1px solid var(--l);background:#fff;border-radius:6px;padding:4px;font-size:12px;cursor:pointer}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:760px){.g3{grid-template-columns:1fr}}
.nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px}.nav button{border:1px solid var(--l);background:#fff;border-radius:10px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer}.nav button:disabled{opacity:.4}.nav b{min-width:70px;text-align:center}
.pop .dn,.dlgb .dn{background:var(--r);color:#fff;border-color:var(--r)}
#ctx{position:fixed;z-index:50;background:#fff;border:1px solid var(--l);border-radius:10px;box-shadow:0 10px 30px #0004;padding:4px;min-width:190px}
#ctx button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;border-radius:6px;color:var(--t)}#ctx button:hover{background:#f5f3f1}#ctx hr{border:0;border-top:1px solid var(--l);margin:4px 0}
#dlg{position:fixed;inset:0;background:#0006;z-index:60;display:flex;align-items:center;justify-content:center;padding:12px}#dlg .card{width:360px;max-width:100%;margin:0}
.dlgb{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}.dlgb button{border:1px solid var(--l);background:#fff;border-radius:8px;padding:8px 16px;font:inherit;cursor:pointer}
.sws{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.sws i{width:20px;height:20px;border-radius:5px;border:1px solid #bbb;cursor:pointer}.bar .sm{flex:none;width:54px;background:#f2ece6;color:var(--t)}body{padding-bottom:96px}
.tb button{border:1px solid var(--l);background:#fff;border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}.tb button:hover{border-color:var(--r)}
.tools button[data-a=text],.tools button[data-a=chart]{background:var(--r);color:#fff;border-color:var(--r);font-weight:700}
.pvx{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}.pimg{width:200px;max-width:100%;max-height:220px;object-fit:contain;border:1px solid var(--l);border-radius:8px;background:#f6f6f6}
.pvt{flex:1;min-width:240px;overflow-x:auto}.pvtb{border-collapse:collapse;font-size:12px;width:100%}.pvtb th,.pvtb td{border:1px solid #d0d0d0;padding:4px 6px;white-space:nowrap}.pvn{font-size:12px;color:var(--m);margin-top:4px}
.pvc{border-top:1px solid var(--l);padding-top:10px;margin-top:10px}.pvw{margin:10px 0}
#res button,#stc{border:1px solid var(--l);background:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;color:var(--t)}
</style>
</head>
<body>
<header><h1>Excel to PPT</h1><p>India Post presentation builder</p></header>
<div class="wrap">
  <div class="steps"><b data-s="1">1 &nbsp;Upload</b><b data-s="2">2 &nbsp;Tables</b><b data-s="3">3 &nbsp;Edit &amp; Export</b></div>

  <section id="s1">
    <div class="g2">
      <div class="card"><h2>Excel workbooks</h2>
        <label class="drop"><b>Select one or more Excel files</b><small>.xlsx, .xls, .csv</small><input type="file" id="xl" accept=".xlsx,.xls,.csv" multiple hidden></label></div>
      <div class="card"><h2>Photo (JPG/PNG) or PDF &rarr; Table &rarr; Slide</h2>
        <label class="drop"><b>Select JPG, PNG or PDF with a table</b><small>Photo is read as table data and slides are made automatically in this theme</small><input type="file" id="dt" accept="image/*,.pdf" multiple hidden></label></div>
    </div>
    <div class="card" id="stat" hidden></div>
    <div class="card" id="msg" hidden></div>
    <div class="card" id="res" hidden></div>
  </section>

  <section id="s2" hidden><div id="tlist"></div></section>

  <section id="s3" hidden>
    <div class="strip" id="strip"></div>
    <div class="nav"><button id="prev">&larr; Previous</button><b id="pg"></b><button id="nx">Next &rarr;</button></div>
    <div class="tools" id="tools">
      <button data-a="undo">Undo</button><button data-a="redo">Redo</button><button data-a="text">+ Text box</button><button data-a="pic">+ Picture</button><button data-a="chart">+ Bar chart</button>
      <button data-a="cil">+Col &larr;</button><button data-a="cir">+Col &rarr;</button><button data-a="cdel">&minus;Col</button><button data-a="rdn">+Row</button><button data-a="rdel">&minus;Row</button><button data-a="frm">&Sigma; Formula</button><button data-a="cpy">Copy style</button><button data-a="pst">Paste style</button>
      <button data-a="slide">+ Blank slide</button><button data-a="dslide">Delete slide</button><button data-a="del">Delete selected</button>
      <label>Slide colour <input type="color" id="sbg"></label>
    </div>
    <div class="card" id="lib" hidden><h2>Pictures</h2>
      <label class="drop"><b>Upload JPG, PNG or PDF</b><input type="file" class="mi" accept="image/*,.pdf" multiple hidden></label>
      <div class="grid" id="libgrid"></div></div>
    <div class="stage" id="stage"><div id="vp"><div id="cv"></div></div><div class="pop" id="pop" hidden></div></div>
  </section>
</div>
<div id="ctx" hidden></div><div id="dlg" hidden></div>
<div class="bar"><button id="bp" class="sm" hidden>&lsaquo;</button><button id="back">Back</button><button id="next" disabled>Continue</button><button id="bn" class="sm" hidden>&rsaquo;</button></div>

// ---------- navigation ----------
function go(n){
  step=n;
  [1,2,3].forEach(i=>{$('s'+i).hidden=i!==n;document.querySelector(`.steps b[data-s="${i}"]`).classList.toggle('on',i===n)});
  $('back').style.visibility=n>1?'visible':'hidden';
  $('next').textContent=['Continue','Build slides','Download PPT'][n-1];
  $('next').disabled=!can();$('bp').hidden=$('bn').hidden=n!==3;
  if(n===3){fit();draw()}
  scrollTo(0,0);
}
document.querySelectorAll('.steps b').forEach(b=>b.onclick=()=>{const n=+b.dataset.s;if(n===3&&!deck.length||n===2&&!tables.length)return;go(n)});
$('back').onclick=()=>go(step-1);
$('next').onclick=()=>{
  if(step===1){if(tables.length)go(2);else{buildDeck();lib.forEach(m=>{let w=12.8,h=w*m.ar;if(h>7){h=7;w=h/m.ar}deck.push({bg:'FFFFFF',els:[mk({t:'img',src:m.src,x:(13.33-w)/2,y:(7.5-h)/2,w,h,ar:m.ar})]})});go(3)}}
  else if(step===2){if(deck.length&&!confirm('Rebuilding the slides will discard manual edits. Continue?'))return;buildDeck();go(3)}
  else exportPpt();
};

$('xl').onchange=async e=>{
  for(const f of e.target.files){
    try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});if(base==='Presentation')base=f.name.replace(/\.[^.]+$/,'');files.push(`${f.name} - ${detect(wb,f.name)} tables`)}
    catch(x){files.push(f.name+' - could not be read')}
  }
  e.target.value='';renderTables();info();
};
document.querySelectorAll('.mi').forEach(i=>i.onchange=async e=>{await addMedia([...e.target.files]);e.target.value=''});
async function addMedia(fs){
  for(const f of fs){
    try{
      if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){
        const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
        for(let i=1;i<=Math.min(pdf.numPages,40);i++){
          const pg=await pdf.getPage(i),vp=pg.getViewport({scale:1.6}),c=document.createElement('canvas');
          c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
          lib.push({src:c.toDataURL('image/jpeg',.85),ar:vp.height/vp.width});
        }
      }else{
        const src=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
        const im=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src});
        lib.push({src,ar:im.height/im.width});
      }
    }catch(x){alert('Could not read '+f.name)}
  }
  renderLib();info();
}

  if(d.ins!==undefined){const m=lib[+d.ins];let w=4,h=w*m.ar;if(h>5){h=5;w=h/m.ar}const o=mk({t:'img',src:m.src,x:(13.33-w)/2,y:1.4,w,h,ar:m.ar});sl.els.push(o);sel=o;cell=null;draw();showPop()}
  if(d.sl!==undefined){const m=lib[+d.sl];let w=12.8,h=w*m.ar;if(h>7){h=7;w=h/m.ar}deck.splice(cur+1,0,{bg:'FFFFFF',els:[mk({t:'img',src:m.src,x:(13.33-w)/2,y:(7.5-h)/2,w,h,ar:m.ar})]});cur++;sel=cell=null;pop.hidden=true;draw()}
};

// ---------- table detection ----------
function detect(wb,fn){
  let cnt=0;
  wb.SheetNames.forEach(name=>{
    const raw=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:'',raw:false});
    const blocks=[];let cu=[];
    raw.forEach(r=>{if(r.some(c=>String(c).trim()!==''))cu.push(r);else if(cu.length){blocks.push(cu);cu=[]}});
    if(cu.length)blocks.push(cu);
    let hint='',k=0;
    blocks.forEach(b=>{
      const first=b[0].filter(c=>String(c).trim()!=='');
      if(b.length===1&&first.length<=1){hint=String(first[0]||'').trim();return}
      let title=hint;hint='';
      if(first.length===1&&b.length>2){title=String(first[0]).trim();b=b.slice(1)}
      if(b.length<2)return;
      k++;
      const n=Math.max(...b.map(r=>r.length));
      const idx=[...Array(n).keys()].filter(i=>b.some(r=>String(r[i]??'').trim()!==''));
      const rows=b.map(r=>idx.map(i=>String(r[i]??'').trim()));
      const head=rows[0].map((h,i)=>h||('Column '+(i+1)));
      tables.push({src:fn,sheet:name,inc:true,title:title||(name+(blocks.length>1?' - Table '+k:'')),head,body:rows.slice(1),keep:head.map(()=>true),red:50,orange:75,yellow:90,per:10});
      cnt++;
    });
  });
  return cnt;
}

  const k=kc(t);if(!k.length)return '<div class="ph">Koi column select nahi hai</div>';
  const th={red:t.red,orange:t.orange,yellow:t.yellow};
  const c=(v,tag)=>{const l=tag==='td'?lvl(th,v):'';const st=tag==='th'?'background:#b3121b;color:#fff':l?`background:#${C[l][0]};color:#${C[l][1]};font-weight:700`:'';return `<${tag} style="${st}">${esc(v)}</${tag}>`};
  return `<div class="pvx">${t.img?`<img class="pimg" src="${t.img}">`:''}<div class="pvt"><table class="pvtb"><tr>${k.map(j=>c(t.head[j],'th')).join('')}</tr>${t.body.slice(0,n).map(r=>`<tr>${k.map(j=>c(r[j]??'','td')).join('')}</tr>`).join('')}</table><div class="pvn">${t.body.length} rows &middot; ${k.length} columns${t.body.length>n?' (pehli '+n+' rows dikha rahe hain)':''}</div></div></div>`;
}
function renderRes(){
  const r=$('res'),ix=tables.map((t,i)=>i).filter(i=>tables[i].img);
  if(ix.length){
    r.hidden=false;
    r.innerHTML='<h2>Photo se bani table - preview</h2><div class="pvn" style="margin:0 0 8px">Check kar lein. Galti ho to "Data edit karo" se sudhaar lein, phir Continue dabayein.</div>'+
      ix.map(i=>`<div class="pvc"><div class="top"><span class="num">Table ${i+1}</span><span class="chip" style="margin:0">${esc(tables[i].src)}</span><button data-e="${i}" style="margin-left:auto">Data edit karo</button></div>${pv(tables[i],12)}</div>`).join('');
  }else if(lib.length&&!tables.length&&files.length){
    r.hidden=false;
    r.innerHTML='<h2>Table nahi mili</h2><div class="pvn" style="margin:0 0 8px">Photo se table auto-read nahi hui. Continue dabane par photo seedhe slide me lag jayegi.</div><div class="grid">'+lib.map(m=>`<div><img src="${m.src}"></div>`).join('')+'</div>';
  }else{r.hidden=true;r.innerHTML=''}
}
$('res').onclick=e=>{const i=e.target.dataset.e;if(i!==undefined)editData(tables[+i])};
function dlXlsx(t){
  try{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([t.head,...t.body]),'Sheet1');
    XLSX.writeFile(wb,((t.title||'table').replace(/[^\w\- ]+/g,'').trim()||'table')+'.xlsx')}catch(x){alert('Excel banane me error: '+x.message)}
}
go(1);
</script>
