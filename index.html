<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excel to PPT - India Post</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
:root{--r:#b3121b;--rd:#7f0b12;--y:#fdb913;--bg:#f4f1ee;--t:#2b2b2b;--m:#6b6b6b;--l:#e4dfda}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--t);padding-bottom:90px}
header{background:linear-gradient(135deg,var(--r),var(--rd));color:#fff;padding:22px 16px 58px}
header h1{margin:0;font-size:22px}header p{margin:4px 0 0;opacity:.85;font-size:13px}
.wrap{max-width:780px;margin:-38px auto 0;padding:0 12px}
.steps{display:flex;gap:6px;background:#fff;border-radius:14px;padding:6px;box-shadow:0 4px 18px #0002;margin-bottom:14px}
.steps b{flex:1;text-align:center;padding:9px 4px;border-radius:10px;font-size:13px;color:var(--m);cursor:pointer}
.steps b.on{background:var(--r);color:#fff}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
h2{font-size:16px;margin:0 0 10px;color:var(--r)}
label{display:block;font-size:13px;color:var(--m);margin-bottom:10px}
input[type=text],input[type=number],select{width:100%;height:40px;border:1px solid var(--l);border-radius:10px;padding:0 10px;font-size:14px;margin-top:4px;background:#fff;color:var(--t)}
.drop{border:2px dashed var(--r);border-radius:14px;padding:34px 10px;text-align:center;cursor:pointer;background:#fff7f7;color:var(--t);font-size:15px}
.drop small{color:var(--m)}
#msg{margin-top:10px;font-size:14px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.num{background:var(--r);color:#fff;border-radius:8px;padding:3px 10px;font-weight:700;font-size:13px}
.chip{background:#f2ece6;border-radius:8px;padding:3px 8px;font-size:12px;color:var(--m)}
.mv{margin-left:auto}.mv button,.ghost{background:#f2ece6;color:var(--t);border:0;border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
.sw{display:flex;align-items:center;gap:8px;margin:12px 0 4px;color:var(--t);font-weight:600}
.sw input{width:18px;height:18px;margin:0}
.tb.off .body{display:none}.tb.off{opacity:.55}
.sec{font-weight:700;font-size:13px;margin:12px 0 6px;display:flex;justify-content:space-between}
.sec a{color:var(--r);cursor:pointer;font-weight:600}
.cols{display:flex;flex-wrap:wrap;gap:6px}
.col{display:flex;align-items:center;border:1px solid var(--l);border-radius:20px;padding:2px 4px 2px 10px;background:#fafafa}
.col.on{border-color:var(--r);background:#fff1f1}
.col label{margin:0;color:var(--t);display:flex;align-items:center;gap:6px;font-size:13px}
.col input{margin:0}
.pc{border:0;background:#e8e3de;color:var(--m);border-radius:50%;width:24px;height:24px;margin-left:6px;font-size:12px;font-weight:700;cursor:pointer}
.pc.on{background:var(--y);color:#000}
.hint,small{color:var(--m);font-size:12px}
.thr,.ex{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thr label{color:var(--t)}
.ex{grid-template-columns:1fr 1fr}
.sc{overflow-x:auto;margin-top:10px;border:1px solid var(--l);border-radius:10px}
.sc table{border-collapse:collapse;font-size:12px;width:100%}
.sc th{background:var(--r);color:#fff;padding:5px 8px;white-space:nowrap}
.sc td{padding:5px 8px;border-top:1px solid var(--l);white-space:nowrap}
td.r{background:#fde0e0;color:#c00000;font-weight:700}td.o{background:#ffe5cc;color:#c25500;font-weight:700}td.y{background:#fff6bf;color:#8a6a00;font-weight:700}
.tg{display:flex;gap:10px;align-items:center;color:var(--t);margin-bottom:8px}.tg input{width:18px;height:18px;margin:0}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:10px 12px;display:flex;gap:10px;box-shadow:0 -4px 18px #0002;justify-content:center}
.bar button{height:48px;border:0;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;flex:1;max-width:370px}
#next{background:var(--r);color:#fff}#next:disabled{opacity:.4}.bar .ghost{background:#f2ece6}
</style>
</head>
<body>
<header><h1>Excel se PPT</h1><p>India Post theme | har table alag slide, aapke apne heading, columns aur colour rules ke saath</p></header>
<div class="wrap">
  <div class="steps"><b data-s="1">1 Upload</b><b data-s="2">2 Tables</b><b data-s="3">3 PPT banao</b></div>

  <section id="s1">
    <div class="card"><h2>Excel upload karo</h2>
      <label class="drop"><b>Excel file chuno</b><br><small>.xlsx, .xls ya .csv</small><input type="file" id="file" accept=".xlsx,.xls,.csv" hidden></label>
      <div id="msg"></div>
      <p class="hint">Ek sheet me agar kai table ho (beech me khali row se alag), to har table alag detect hogi.</p>
    </div>
  </section>

  <section id="s2" hidden><div id="tlist"></div></section>

  <section id="s3" hidden>
    <div class="card"><h2>Cover slide</h2>
      <label>Chhota heading<input type="text" id="kicker" value="INDIA POST"></label>
      <label>Main title<input type="text" id="ptitle" value="Vertical-wise & Division-wise Performance Review"></label>
      <label>Subtitle<input type="text" id="sub" value="Revenue, Article Count, Aadhaar | PLI & RPLI And POSB"></label>
      <label>Peela badge<input type="text" id="badge" value="Indore Region | Q1 & Q2, FY 2026-27"></label>
    </div>
    <div class="card"><h2>Extra slides</h2>
      <label class="tg"><input type="checkbox" id="agenda" checked> Agenda slide (saare table headings ki list)</label>
      <label class="tg"><input type="checkbox" id="alert" checked> Alert Summary slide (kitne red / orange / yellow aur sabse kamzor 3)</label>
      <label class="tg"><input type="checkbox" id="num" checked> Slide number dikhao</label>
      <label class="tg"><input type="checkbox" id="rem" checked> Ye settings yaad rakho (agli baar same Excel par headings, ticks, % rules khud bhar jayenge)</label>
      <p id="sum" class="hint"></p>
    </div>
  </section>
</div>
<div class="bar"><button class="ghost" id="back">&larr; Peeche</button><button id="next" disabled>Aage &rarr;</button></div>

function go(n){
  step=n;
  [1,2,3].forEach(i=>{$('s'+i).hidden=i!==n;document.querySelector(`.steps b[data-s="${i}"]`).classList.toggle('on',i===n)});
  $('back').style.visibility=n>1?'visible':'hidden';
  $('next').textContent=n<3?'Aage \u2192':'PPT banao \u2B07';
  $('next').disabled=!wb||(n===2&&!tables.some(t=>t.inc));
  if(n===3){const k=tables.filter(t=>t.inc&&cols(t).length);const sl=k.reduce((a,t)=>a+Math.max(1,Math.ceil(t.body.length/t.per))+(t.chart?1:0),1);$('sum').textContent=`${k.length} table, lagbhag ${sl}+ slides banengi.`}
  scrollTo(0,0);
}
document.querySelectorAll('.steps b').forEach(b=>b.onclick=()=>{if(wb)go(+b.dataset.s)});
$('back').onclick=()=>go(step-1);
$('next').onclick=()=>step<3?go(step+1):make();

// ---------- upload & table detection ----------
$('file').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    fname=f.name.replace(/\.[^.]+$/,'');
    detect();
    if(!tables.length){$('msg').textContent='Koi table nahi mili. Header + kam se kam 1 data row chahiye.';return}
    $('msg').textContent=`${f.name}: ${wb.SheetNames.length} sheet, ${tables.length} table mili.`;
    renderTables();go(2);
  }catch(err){$('msg').textContent='File nahi khul payi. Kya ye sahi Excel file hai?'}
});

function detect(){
  tables=[];
  wb.SheetNames.forEach(name=>{
    const raw=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:'',raw:false});
    const blocks=[];let cur=[];
    raw.forEach(r=>{if(r.some(c=>String(c).trim()!==''))cur.push(r);else if(cur.length){blocks.push(cur);cur=[]}});
    if(cur.length)blocks.push(cur);
    let hint='',k=0;
    blocks.forEach(b=>{
      const first=b[0].filter(c=>String(c).trim()!=='');
      if(b.length===1&&first.length<=1){hint=String(first[0]||'').trim();return}
      let title=hint;hint='';
      if(first.length===1&&b.length>2){title=String(first[0]).trim();b=b.slice(1)}
      if(b.length<2)return;
      k++;
      const n=Math.max(...b.map(r=>r.length));
      const idx=[...Array(n).keys()].filter(i=>b.some(r=>String(r[i]??'').trim()!==''));
      const rows=b.map(r=>idx.map(i=>String(r[i]??'').trim()));
      const head=rows[0].map((h,i)=>h||('Col '+(i+1))),body=rows.slice(1);
      const t={sheet:name,inc:true,title:title||(name+(blocks.length>1?' - Table '+k:'')),head,body,
        keep:head.map(()=>true),pct:head.map((h,i)=>i>0&&isPct(h,body.map(r=>r[i]))),
        red:50,orange:75,yellow:90,chart:false,cc:-1,per:10,sig:'e2p|'+name+'|'+head.join('|')};
      const s=ls(t.sig);
      if(s&&s.keep&&s.keep.length===head.length)SAVE.forEach(f=>{if(s[f]!==undefined)t[f]=s[f]});
      tables.push(t);
    });
  });
}

// ---------- tables UI ----------
function renderTables(){
  $('tlist').innerHTML=tables.map((t,i)=>`
  <div class="card tb" data-i="${i}">
    <div class="top"><span class="num">Table ${i+1}</span><span class="chip">${esc(t.sheet)} | ${t.body.length} rows | ${t.head.length} columns</span>
      <span class="mv"><button data-a="up">&uarr;</button> <button data-a="dn">&darr;</button></span></div>
    <label class="sw"><input type="checkbox" data-f="inc" ${t.inc?'checked':''}> Is table ko PPT me lo</label>
    <div class="body">
      <label>Is table ka heading (slide ke upar)<input type="text" data-f="title" value="${esc(t.title)}"></label>
      <div class="sec">Kaun se columns rakhne he?<span><a data-a="all">Sab</a> | <a data-a="none">Koi nahi</a></span></div>
      <div class="cols">${t.head.map((h,j)=>`<span class="col ${t.keep[j]?'on':''}"><label><input type="checkbox" data-k="${j}" ${t.keep[j]?'checked':''}> ${esc(h)}</label><button type="button" data-p="${j}" class="pc ${t.pct[j]?'on':''}" title="Percentage column">%</button></span>`).join('')}</div>
      <p class="hint">Peela % button = ye percentage column he. Colour sirf unhi columns me lagega.</p>
      <div class="sec">Colour rules (% columns)</div>
      <div class="thr">
        <label>&#128308; Red: isse kam<input type="number" data-f="red" value="${t.red}"></label>
        <label>&#128992; Orange: isse kam<input type="number" data-f="orange" value="${t.orange}"></label>
        <label>&#128993; Yellow: isse kam<input type="number" data-f="yellow" value="${t.yellow}"></label>
      </div>
      <div class="ex">
        <label>Ek slide me rows<select data-f="per">${[6,8,10,12,15].map(n=>`<option ${n===t.per?'selected':''}>${n}</option>`).join('')}</select></label>
        <label>Chart<select data-f="chart"><option value="0">Nahi chahiye</option><option value="1" ${t.chart?'selected':''}>Chart bhi banao</option></select></label>
      </div>
      <label><select data-f="cc"></select></label>
      <div class="prev"></div>
    </div>
  </div>`).join('');
  tables.forEach((_,i)=>upd(i));
}
function prevHtml(t){
  const k=cols(t);if(!k.length)return '<small>Koi column select nahi he</small>';
  const rows=t.body.slice(0,5);
  return `<div class="sc"><table><tr>${k.map(j=>`<th>${esc(t.head[j])}</th>`).join('')}</tr>${rows.map(r=>`<tr>${k.map(j=>`<td class="${t.pct[j]?lvl(t,r[j]):''}">${esc(r[j])}</td>`).join('')}</tr>`).join('')}</table></div><small>Preview: pehli ${rows.length} rows</small>`;
}
function upd(i){
  const t=tables[i],c=document.querySelector(`.tb[data-i="${i}"]`);
  c.classList.toggle('off',!t.inc);
  const nums=t.head.map((_,j)=>j).filter(j=>j>0&&t.keep[j]&&t.body.filter(r=>isNum(r[j])).length>=t.body.length*.6);
  if(!nums.includes(t.cc))t.cc=nums.length?nums[0]:-1;
  const s=c.querySelector('[data-f=cc]');
  s.innerHTML=nums.map(j=>`<option value="${j}" ${j===t.cc?'selected':''}>Chart column: ${esc(t.head[j])}</option>`).join('');
  s.parentElement.hidden=!t.chart||!nums.length;
  c.querySelector('.prev').innerHTML=prevHtml(t);
  $('next').disabled=step===2&&!tables.some(x=>x.inc);
}
$('tlist').addEventListener('input',e=>{
  const el=e.target,c=el.closest('.tb');if(!c)return;
  const i=+c.dataset.i,t=tables[i],f=el.dataset.f;
  if(f){t[f]=f==='chart'?el.value==='1':el.type==='checkbox'?el.checked:(el.type==='number'||el.tagName==='SELECT')?+el.value:el.value}
  else if(el.dataset.k!==undefined){t.keep[+el.dataset.k]=el.checked;el.closest('.col').classList.toggle('on',el.checked)}
  upd(i);
});
$('tlist').addEventListener('click',e=>{
  const el=e.target.closest('[data-a],[data-p]'),c=e.target.closest('.tb');if(!el||!c)return;
  const i=+c.dataset.i,t=tables[i],a=el.dataset.a;
  if(el.dataset.p!==undefined){const j=+el.dataset.p;t.pct[j]=!t.pct[j];el.classList.toggle('on',t.pct[j]);return upd(i)}
  if(a==='all'||a==='none'){t.keep=t.keep.map(()=>a==='all');c.querySelectorAll('[data-k]').forEach(x=>{x.checked=a==='all';x.closest('.col').classList.toggle('on',a==='all')});return upd(i)}
  const o=a==='up'?i-1:i+1;if(o<0||o>=tables.length)return;
  [tables[i],tables[o]]=[tables[o],tables[i]];renderTables();
});

// ---------- PPT ----------
function make(){
  if(typeof PptxGenJS==='undefined'){alert('Library load nahi hui. Internet check karo aur page refresh karo.');return}
  $('next').disabled=true;
  try{
    build().writeFile({fileName:fname+'_PPT.pptx'});
    if($('rem').checked){tables.forEach(t=>{const o={};SAVE.forEach(f=>o[f]=t[f]);ls(t.sig,o)})}
  }catch(err){alert('Error: '+err.message)}
  $('next').disabled=false;
}
function build(){
  const p=new PptxGenJS();p.layout='LAYOUT_WIDE';
  const F='Arial',RED='B3121B',YEL='FDB913',TX='2B2B2B',inc=tables.filter(t=>t.inc&&cols(t).length);
  const base=title=>{
    const s=p.addSlide();s.background={color:'FFFFFF'};
    s.addText(title,{x:.6,y:.3,w:12.1,h:.65,fontFace:F,fontSize:title.length>45?22:30,bold:true,color:RED,margin:0,valign:'middle'});
    s.addShape(p.ShapeType.rect,{x:.6,y:.98,w:1.3,h:.06,fill:{color:YEL},line:{color:YEL}});
    if($('num').checked)s.addText(String(p.slides.length),{x:12.1,y:7.0,w:.6,h:.3,fontFace:F,fontSize:10,color:'777777',align:'right',margin:0});
    return s;
  };
  // cover
  let s=p.addSlide();s.background={color:RED};
  s.addText($('kicker').value,{x:.9,y:1.6,w:8,h:.5,fontFace:F,fontSize:20,bold:true,color:YEL,charSpacing:4,margin:0});
  s.addText($('ptitle').value,{x:.9,y:2.2,w:8.4,h:2.2,fontFace:F,fontSize:44,bold:true,color:'FFFFFF',valign:'top',margin:0});
  s.addText($('sub').value,{x:.9,y:4.5,w:8.6,h:.5,fontFace:F,fontSize:16,color:'FFFFFF',margin:0});
  s.addShape(p.ShapeType.roundRect,{x:.9,y:5.3,w:4.6,h:.55,rectRadius:.27,fill:{color:YEL}});
  s.addText($('badge').value,{x:.9,y:5.3,w:4.6,h:.55,fontFace:F,fontSize:13,bold:true,color:TX,align:'center',valign:'middle',margin:0});
  s.addShape(p.ShapeType.roundRect,{x:9.33,y:.6,w:3.1,h:3,rectRadius:.15,fill:{color:'FFFFFF'}});
  s.addImage({data:LOGO,x:9.65,y:.95,w:2.46,h:1.59});

  // agenda
  if($('agenda').checked&&inc.length){
    s=base('Agenda');const h=Math.ceil(inc.length/2);
    [inc.slice(0,h),inc.slice(h)].forEach((g,gi)=>{if(g.length)s.addText(g.map((t,n)=>({text:`${gi*h+n+1}.  ${t.title}`,options:{breakLine:true,fontSize:18,color:TX,paraSpaceAfter:10}})),{x:.6+gi*6.2,y:1.4,w:5.9,h:5,fontFace:F,valign:'top',margin:0})});
  }
  // tables: each on its own slide(s)
  const alerts=[];
  inc.forEach(t=>{
    const k=cols(t),n=k.length,hd=k.map(j=>t.head[j]);
    const pages=Math.max(1,Math.ceil(t.body.length/t.per)),fs=n>9?9:n>6?11:13,rh=Math.min(.42,5.5/(t.per+1));
    const pj=k.filter(j=>t.pct[j]);
    for(let pg=0;pg<pages;pg++){
      const sl=base(t.title+(pages>1?` (${pg+1}/${pages})`:''));
      const tbl=[hd.map(c=>({text:c,options:{bold:true,color:'FFFFFF',fill:{color:RED},align:'center',valign:'middle'}}))];
      t.body.slice(pg*t.per,(pg+1)*t.per).forEach((r,ri)=>{
        const tot=/total/i.test(r[0]);
        tbl.push(k.map((j,ci)=>{
          const v=r[j],l=t.pct[j]?lvl(t,v):'';
          return {text:v,options:{color:l?C[l][1]:TX,bold:tot||!!l,align:ci===0?'left':(isNum(v)?'center':'left'),valign:'middle',fill:{color:l?C[l][0]:(tot?'FFF0C2':(ri%2?'F6F6F6':'FFFFFF'))}}};
        }));
      });
      const c0=n>1?(n>10?1.8:2.2):12.1;
      sl.addTable(tbl,{x:.6,y:1.25,w:12.1,colW:[c0,...Array(n-1).fill((12.1-c0)/(n-1||1))],fontFace:F,fontSize:fs,border:{type:'solid',color:'D0D0D0',pt:.5},rowH:rh});
      if(pj.length){
        const L=[['r',`below ${t.red}%`],['o',`${t.red}-${t.orange}%`],['y',`${t.orange}-${t.yellow}%`]];
        sl.addText(L.flatMap(([l,x])=>[{text:'\u25A0 ',options:{color:C[l][2],bold:true}},{text:x+'      ',options:{color:'777777'}}]),{x:.6,y:6.95,w:10,h:.3,fontFace:F,fontSize:10,margin:0});
      }
    }
    if(pj.length){
      const j=pj[0],d=t.body.filter(r=>!/total/i.test(r[0])&&isNum(r[j])),g={r:0,o:0,y:0};
      d.forEach(r=>{const l=lvl(t,r[j]);if(l)g[l]++});
      alerts.push([`${t.title} | ${t.head[j]}`,g.r,g.o,g.y,d.slice().sort((a,b)=>toNum(a[j])-toNum(b[j])).slice(0,3).map(r=>`${r[0]} (${r[j]})`).join(', ')]);
    }
    if(t.chart&&t.cc>0&&k.includes(t.cc)){
      const d=t.body.filter(r=>!/total/i.test(r[0])&&isNum(r[t.cc])).slice(0,12);
      if(d.length>1){
        const sl=base(`${t.title}: ${t.head[t.cc]}`);
        sl.addChart(p.charts.BAR,[{name:t.head[t.cc],labels:d.map(r=>r[0]),values:d.map(r=>toNum(r[t.cc]))}],
          {x:.6,y:1.3,w:12.1,h:5.5,barDir:'col',chartColors:d.map(r=>t.pct[t.cc]?C[lvl(t,r[t.cc])][2]:RED),showLegend:false,showValue:true,dataLabelColor:TX,dataLabelFontSize:11,
           catAxisLabelColor:TX,valAxisLabelColor:TX,catAxisLabelFontFace:F,valAxisLabelFontFace:F,valGridLine:{color:'D0D0D0',size:.5}});
      }
    }
  });
  // alert summary
  if($('alert').checked&&alerts.length){
    const P=Math.ceil(alerts.length/8);
    for(let i=0;i<alerts.length;i+=8){
      const sl=base('Alert Summary'+(P>1?` (${i/8+1}/${P})`:''));
      const H=(x,f,c)=>({text:x,options:{bold:true,color:c,fill:{color:f},align:'center',valign:'middle'}});
      const rows=[[H('Table | Column',RED,'FFFFFF'),H('Red','C00000','FFFFFF'),H('Orange','E46C0A','FFFFFF'),H('Yellow',YEL,TX),H('Lowest 3',RED,'FFFFFF')]];
      alerts.slice(i,i+8).forEach(a=>rows.push(a.map((v,ci)=>({text:String(v),options:{align:ci&&ci<4?'center':'left',valign:'middle',bold:ci>0&&ci<4,color:TX}}))));
      sl.addTable(rows,{x:.6,y:1.3,w:12.1,colW:[4.2,1.1,1.1,1.1,4.6],fontFace:F,fontSize:12,border:{type:'solid',color:'D0D0D0',pt:.5},rowH:.55});
    }
  }
  return p;
}

// restore cover text
(()=>{const c=ls('e2p_cover');if(c)['kicker','ptitle','sub','badge'].forEach(i=>{if(c[i]!==undefined)$(i).value=c[i]})})();
['kicker','ptitle','sub','badge'].forEach(i=>$(i).addEventListener('input',()=>{const o={};['kicker','ptitle','sub','badge'].forEach(x=>o[x]=$(x).value);ls('e2p_cover',o)}));
go(1);
</script>
